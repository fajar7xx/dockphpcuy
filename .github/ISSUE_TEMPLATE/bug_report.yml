name: Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much
        detail as you can so it can be reproduced.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cp .env.example .env
        2. make up
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Output of `docker compose logs`, `make nginx-test`, etc.
      render: shell
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker / Compose version
      description: Output of `docker --version` and `docker compose version`
    validations:
      required: true
