x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    container_name: dockphpcuy-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./projects:/var/www
      - ./Nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      php85:
          condition: service_healthy
    networks:
      - dockphpcuy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPUS:-0.25}"
          memory: "${NGINX_MEMORY:-64M}"

  php85:
    build:
      context: ./PHP85
    container_name: dockphpcuy-php85
    restart: unless-stopped
    volumes:
      - ./projects:/var/www
      - ./PHP85/conf.d/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
      - ./PHP85/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./PHP85/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - php-fpm -t
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dockphpcuy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${PHP85_CPUS:-0.75}"
          memory: "${PHP85_MEMORY:-640M}"

  mariadb:
    image: mariadb:lts
    container_name: dockphpcuy-mariadb-lts
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
    volumes:
      - ./MariaDB/data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dockphpcuy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${MARIADB_CPUS:-0.75}"
          memory: "${MARIADB_MEMORY:-640M}"

  phpmyadmin:
    build:
      context: ./PHPMyAdmin
    container_name: dockphpcuy-phpmyadmin-latest
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      mariadb:
          condition: service_healthy
    networks:
      - dockphpcuy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${PHPMYADMIN_CPUS:-0.25}"
          memory: "${PHPMYADMIN_MEMORY:-192M}"

networks:
  dockphpcuy:
