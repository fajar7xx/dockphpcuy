[PHP]

; General
date.timezone = Asia/Jakarta

; Error reporting
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Memory
memory_limit = 512M

; Execution
max_execution_time = 120
max_input_time = 120

; Upload
upload_max_filesize = 64M
post_max_size = 64M

; Input
max_input_vars = 5000

; Output
output_buffering = 4096

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600
